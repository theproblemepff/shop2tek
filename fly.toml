# Remplace le nom ci-dessous par un nom unique (lettres minuscules, chiffres, tirets).
app = "CHANGE-MOI-nom-unique"
primary_region = "cdg"

[env]
  PANEL_HOST = "0.0.0.0"
  PANEL_PORT = "8000"
  DATA_DIR = "/data"
  DATABASE_URL = "sqlite+aiosqlite:////data/data.db"
  PANEL_COOKIE_SECURE = "1"
  PANEL_IP_HEADER = "fly-client-ip"

[mounts]
  source = "botdata"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
