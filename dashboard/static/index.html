<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel du bot</title><style>
:root{--bg:#12131a;--side:#171923;--card:#1b1d27;--tx:#e8e8f0;--mut:#9a9cb0;--ac:#7c5cff;--ok:#2ecc71;--ko:#e74c3c;--wa:#f1c40f;--bd:#2a2d3d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#layout{display:flex;min-height:100vh}
nav{width:220px;background:var(--side);padding:16px;flex-shrink:0}
nav h1{font-size:1.1rem;margin:0 0 16px}
nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--mut);text-decoration:none;margin-bottom:4px}
nav a.active,nav a:hover{background:var(--card);color:var(--tx)}
main{flex:1;padding:24px;max-width:960px;min-width:0}
h2{margin:0 0 6px}h3{margin:0 0 10px;font-size:1.05rem}
.intro{color:var(--mut);margin:0 0 18px;line-height:1.5}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid var(--bd)}
.card.dirty{border-color:var(--wa)}.dirtymark{color:var(--wa);font-size:.8rem;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:1.7rem}.stat span{color:var(--mut);font-size:.8rem;line-height:1.3;display:block}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:.9rem}
.help{color:var(--mut);font-size:.8rem;margin:0 0 6px;line-height:1.4}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #333649;background:var(--bg);color:var(--tx);font-size:1rem;font-family:inherit}
select[multiple]{min-height:110px}input[type=color]{width:60px;height:36px;border:0;background:none}
button{padding:10px 16px;border-radius:8px;border:0;background:var(--ac);color:#fff;font-size:.95rem;cursor:pointer}
a.btn{display:inline-block;padding:10px 16px;border-radius:8px;background:#2d3043;color:#fff;text-decoration:none;font-size:.95rem}
button.sec{background:#2d3043}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.f1>*{flex:1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mut);font-weight:600}
.tag{padding:2px 8px;border-radius:99px;font-size:.75rem;background:#2d3043}.tag.ok{background:#1e4d33}.tag.ko{background:#5a2323}.tag.wa{background:#5a4a14}
code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:.85rem}
.bars{display:flex;gap:10px;align-items:flex-end;height:120px}.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:90px}.bars i{width:12px;border-radius:3px 3px 0 0;min-height:2px}
.chk{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.chk:last-child{border:0}.chk a{color:var(--ac)}
#toast{position:fixed;bottom:16px;right:16px;padding:12px 16px;border-radius:8px;background:var(--card);display:none;border:1px solid var(--bd);z-index:9}
#loginBox{max-width:360px;margin:15vh auto}
@media(max-width:760px){#layout{flex-direction:column}nav{width:auto;display:flex;flex-wrap:wrap;gap:4px}nav h1{width:100%}nav a{margin:0}main{padding:14px}}
</style></head><body>
<div id="loginBox" class="card" hidden>
  <h2>Panel du bot</h2><p class="intro">Entre le mot de passe défini dans ton fichier <code>.env</code> (PANEL_ADMIN_PASSWORD).</p>
  <label for="pwInput">Mot de passe</label><input id="pwInput" type="password" autocomplete="current-password">
  <p><button id="loginBtn">Connexion</button></p>
</div>
<div id="layout" hidden>
  <nav id="nav"><h1>🤖 Panel du bot</h1></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
let HELP = {sections: {}, fields: {}, placeholders: {}}, GUILD = {available: false, guilds: [], channels: [], roles: []}, CONFIG = {};
const KIND_FR = {warn: "Avertissement", timeout: "Timeout", untimeout: "Fin de timeout", kick: "Expulsion", ban: "Bannissement", unban: "Débannissement"};
const NAV = [
  ["guide", "🚀 Démarrer", "Guide de démarrage"],
  ["dashboard", "📊 Tableau de bord", "Tableau de bord"],
  ["config", "⚙️ Configuration", "Configuration"],
  ["commands", "💬 Commandes", "Commandes du bot"],
  ["moderation", "🛡️ Modération", "Historique de modération"],
  ["members", "👥 Membres", "Membres"],
  ["ids", "🆔 ID", "Identifiants Discord"],
  ["logs", "📜 Logs", "Journal des événements"],
];

function toast(msg, ok = true) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  t.style.borderLeft = "4px solid " + (ok ? "var(--ok)" : "var(--ko)");
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.display = "none"; }, 3500);
}
async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  let d = null; try { d = await r.json(); } catch (e) { /* pas de JSON */ }
  if (!r.ok) { const err = new Error((d && (typeof d.detail === "string" ? d.detail : "Requête invalide")) || ("Erreur " + r.status)); err.status = r.status; throw err; }
  return d;
}
function el(tag, props = {}, children = []) {
  const e = document.createElement(tag); Object.assign(e, props);
  [].concat(children).forEach((c) => e.append(c)); return e;
}
const fmtDate = (iso) => iso ? new Date(iso).toLocaleString("fr-FR", {dateStyle: "short", timeStyle: "short"}) : "—";
function fmtDur(s) {
  if (!s) return "—";
  const m = Math.round(s / 60), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mi = m % 60;
  return [d && d + " j", h && h + " h", mi && mi + " min"].filter(Boolean).join(" ") || "< 1 min";
}
const tag = (text, cls = "") => el("span", {className: "tag " + cls, textContent: text});
const head = (title, intro) => [el("h2", {textContent: title}), el("p", {className: "intro", textContent: intro})];

function table(cols, rows, empty = "Rien à afficher pour le moment.") {
  if (!rows.length) return el("p", {className: "help", textContent: empty});
  const t = el("table", {}, [el("thead", {}, el("tr", {}, cols.map((c) => el("th", {textContent: c.label})))),
    el("tbody", {}, rows.map((r) => el("tr", {}, cols.map((c) => { const v = c.render ? c.render(r) : r[c.key]; return el("td", {}, v instanceof Node ? v : String(v ?? "—")); }))))]);
  return el("div", {className: "tw"}, t);
}
function pager(state, total, reload) {
  const pages = Math.max(1, Math.ceil(total / state.limit)), cur = Math.floor(state.offset / state.limit) + 1;
  return el("div", {className: "row", style: "margin-top:12px"}, [
    el("button", {className: "sec", textContent: "← Précédent", disabled: cur <= 1, onclick: () => { state.offset -= state.limit; reload(); }}),
    el("span", {className: "help", textContent: "Page " + cur + " / " + pages + " (" + total + " résultat" + (total > 1 ? "s" : "") + ")"}),
    el("button", {className: "sec", textContent: "Suivant →", disabled: cur >= pages, onclick: () => { state.offset += state.limit; reload(); }})]);
}

/* ---------- Guide ---------- */
async function pageGuide(root) {
  const [status] = await Promise.all([api("/api/status"), loadGuild()]);
  const c = CONFIG, pick = (v) => v && v !== "0" && !(Array.isArray(v) && !v.length);
  const items = [
    [status.bot === "connecté", "Le bot est connecté à Discord", "Sinon : vérifie le token dans .env et active les intents « Server Members » et « Message Content » dans le portail développeur Discord.", null],
    [pick(c.general.guild_id), "Serveur choisi", "Choisis le serveur géré par le bot.", "config"],
    [pick(c.channels.welcome), "Salon d'accueil choisi", "Sans lui, aucun message de bienvenue n'est envoyé.", "config"],
    [pick(c.channels.logs), "Salon de logs choisi", "Sans lui, les actions de modération sont enregistrées dans le panel mais pas postées dans Discord.", "config"],
    [pick(c.roles.member), "Rôle membre choisi", "Nécessaire pour que la vérification donne l'accès au serveur.", "config"],
    [pick(c.roles.unverified), "Rôle non vérifié choisi", "Donné aux nouveaux pour restreindre leur accès avant vérification.", "config"],
    [pick(c.channels.verification), "Salon de vérification choisi", "Là où le bouton « Se vérifier » sera publié.", "config"],
    [c.verification.enabled, "Vérification activée", "Coche « Activer la vérification » dans la configuration, puis tape /verification-publier dans Discord.", "config"],
  ];
  root.append(...head("Guide de démarrage", "Suis ces étapes dans l'ordre. Chaque ligne se coche toute seule quand c'est fait."),
    el("div", {className: "card"}, items.map(([ok, t, d, link]) => el("div", {className: "chk"}, [
      el("div", {textContent: ok ? "✅" : "⬜"}),
      el("div", {}, [el("b", {textContent: t}), el("div", {className: "help", textContent: d}),
        link && !ok ? el("a", {href: "#" + link, textContent: "Aller le régler →"}) : ""])]))),
    el("div", {className: "card"}, [el("h3", {textContent: "Bon à savoir"}),
      el("p", {className: "help", innerHTML: "• Pour copier un identifiant à la main : Discord → Paramètres → Avancés → Mode développeur, puis clic droit → « Copier l'identifiant ».<br>• Le rôle du bot doit être placé <b>au-dessus</b> des rôles qu'il gère (Paramètres du serveur → Rôles).<br>• La liste de toutes les commandes est dans l'onglet « Commandes »."})]));
}

/* ---------- Tableau de bord ---------- */
async function pageDashboard(root) {
  const [st, status] = await Promise.all([api("/api/stats"), api("/api/status"), loadGuild()]);
  const stat = (v, label, hint) => el("div", {className: "card stat"}, [el("b", {textContent: v}), el("strong", {textContent: label}), el("span", {textContent: hint})]);
  const max = Math.max(1, ...st.joins, ...st.leaves);
  const bars = el("div", {className: "bars"}, st.days.map((d, i) => el("div", {className: "col"}, [
    el("div", {className: "pair"}, [el("i", {style: "background:var(--ok);height:" + st.joins[i] / max * 100 + "%", title: st.joins[i] + " arrivée(s)"}),
      el("i", {style: "background:var(--ko);height:" + st.leaves[i] / max * 100 + "%", title: st.leaves[i] + " départ(s)"})]),
    el("span", {className: "help", textContent: d})])));
  root.append(...head("Tableau de bord", "Vue d'ensemble. Les chiffres viennent de la base du bot : ils comptent ce que le bot a vu depuis son installation, pas l'historique complet du serveur."),
    el("div", {className: "grid"}, [
      stat(status.bot === "connecté" ? "🟢 Connecté" : "🔴 Déconnecté", "État du bot", status.latency_ms != null ? "Latence : " + status.latency_ms + " ms" : "Pas de connexion Discord active"),
      stat(GUILD.available ? GUILD.member_count : "—", GUILD.available ? GUILD.name : "Serveur", "Nombre de membres selon Discord (direct)"),
      stat(st.members_present, "Membres suivis", "Arrivés depuis l'installation du bot et toujours présents"),
      stat(st.members_verified, "Vérifiés", "Parmi les membres suivis, ceux qui ont réussi la vérification"),
      stat(st.sanctions_total, "Sanctions", Object.entries(st.sanctions).map(([k, n]) => (KIND_FR[k] || k) + " : " + n).join(" · ") || "Aucune pour l'instant"),
      stat(st.errors_24h, "Erreurs (24 h)", "Actions du bot qui ont échoué : voir l'onglet Logs")]),
    el("div", {className: "card"}, [el("h3", {textContent: "Arrivées et départs sur 7 jours"}),
      el("p", {className: "help", textContent: "Vert : arrivées. Rouge : départs. Survole une barre pour le chiffre exact."}), bars]),
    el("div", {className: "card"}, [el("h3", {textContent: "Derniers événements"}), logTable(st.recent)]));
}
function logTable(items) {
  return table([{label: "Date", render: (r) => fmtDate(r.created_at)}, {label: "Type", render: (r) => el("code", {textContent: r.kind})},
    {label: "Cible", key: "target_id"}, {label: "Résultat", render: (r) => tag(r.result === "ok" ? "OK" : "Erreur", r.result === "ok" ? "ok" : "ko")},
    {label: "Détails", key: "details"}], items);
}

/* ---------- Configuration ---------- */
async function loadGuild() { try { GUILD = await api("/api/guild"); } catch (e) { /* garde l'ancien */ } CONFIG = await api("/api/config"); }
function option(value, label, selected) { return el("option", {value, textContent: label, selected}); }
function buildControl(sec, key, val, meta) {
  const id = "f-" + sec + "-" + key;
  const kind = meta.kind || (typeof val === "boolean" ? "bool" : typeof val === "number" ? "number" : Array.isArray(val) ? "list" : "text");
  let input;
  if (kind === "bool") input = el("input", {type: "checkbox", id, checked: val});
  else if (kind === "number") input = el("input", {type: "number", id, value: val});
  else if (kind === "color") input = el("input", {type: "color", id, value: val});
  else if (kind === "longtext") input = el("textarea", {id, rows: 3, value: val});
  else if (kind === "select") { input = el("select", {id}); meta.options.forEach(([v, l]) => input.append(option(v, l, v === val))); }
  else if (["guild", "role", "roles", "channel"].includes(kind) && GUILD.available) {
    const list = kind === "guild" ? GUILD.guilds : kind === "channel" ? GUILD.channels : GUILD.roles;
    const cur = [].concat(val).map(String), multi = kind === "roles";
    input = el("select", {id, multiple: multi});
    if (!multi) input.append(option("0", "— aucun —", cur[0] === "0"));
    list.forEach((o) => input.append(option(o.id, (kind === "channel" ? "# " : "") + o.name, cur.includes(o.id))));
    cur.filter((v) => v !== "0" && !list.some((o) => o.id === v)).forEach((v) => input.append(option(v, "(introuvable) " + v, true)));
  } else input = el("input", {type: "text", id, value: Array.isArray(val) ? val.join(", ") : val, placeholder: ["guild", "role", "roles", "channel"].includes(kind) ? "Identifiant Discord (bot non connecté)" : ""});
  input.dataset.kind = kind;
  return input;
}
function readValue(input, orig) {
  const k = input.dataset.kind;
  if (k === "bool") return input.checked;
  if (k === "number") return Number(input.value);
  if (input.tagName === "SELECT" && input.multiple) return [...input.selectedOptions].map((o) => o.value);
  if (Array.isArray(orig)) return input.value.split(",").map((x) => x.trim()).filter(Boolean);
  return input.value;
}
async function pageConfig(root) {
  await loadGuild();
  root.append(...head("Configuration", "Chaque section a son bouton « Enregistrer ». Les changements s'appliquent tout de suite au bot, sans redémarrage."));
  if (!GUILD.available) root.append(el("div", {className: "card", textContent: "⚠️ Le bot n'est pas connecté à un serveur : les listes de salons et de rôles sont indisponibles, saisis les identifiants à la main."}));
  const ph = Object.entries(HELP.placeholders);
  if (ph.length) root.append(el("p", {className: "help", textContent: "Variables utilisables dans les textes : " + ph.map(([k, v]) => k + " = " + v).join(" · ")}));
  for (const sec of Object.keys(CONFIG)) {
    const sh = HELP.sections[sec] || {title: sec, help: ""};
    const mark = el("span", {className: "dirtymark", textContent: "", hidden: true});
    const card = el("div", {className: "card"}, [el("h3", {}, [sh.title, mark]), el("p", {className: "help", textContent: sh.help})]);
    const inputs = {};
    for (const [key, val] of Object.entries(CONFIG[sec])) {
      const meta = HELP.fields[sec + "." + key] || {label: key, help: ""};
      const input = buildControl(sec, key, val, meta); inputs[key] = input;
      const lab = el("label", {htmlFor: input.id, textContent: meta.label || key});
      card.append(input.type === "checkbox" ? el("div", {className: "row", style: "margin-top:12px"}, [input, el("b", {textContent: meta.label || key})]) : lab);
      card.append(el("p", {className: "help", textContent: meta.help || ""}));
      if (input.type !== "checkbox") card.append(input);
    }
    card.addEventListener("input", () => { card.classList.add("dirty"); mark.hidden = false; mark.textContent = "● modifications non enregistrées"; });
    card.append(el("p", {}, el("button", {textContent: "Enregistrer", onclick: async () => {
      try {
        const body = {}; for (const [k, i] of Object.entries(inputs)) body[k] = readValue(i, CONFIG[sec][k]);
        CONFIG[sec] = await api("/api/config/" + sec, {method: "PUT", body: JSON.stringify(body)});
        card.classList.remove("dirty"); mark.hidden = true; toast("« " + sh.title + " » enregistré");
      } catch (e) { toast(e.message, false); }
    }})));
    root.append(card);
  }
}

/* ---------- Commandes ---------- */
async function pageCommands(root) {
  const cmds = await api("/api/commands");
  const box = el("div"), search = el("input", {type: "text", placeholder: "Rechercher une commande…"});
  const draw = () => {
    const q = search.value.toLowerCase(); box.replaceChildren();
    const cats = [...new Set(cmds.map((c) => c.category))];
    for (const cat of cats) {
      const list = cmds.filter((c) => c.category === cat && (c.name + c.description).toLowerCase().includes(q));
      if (!list.length) continue;
      box.append(el("h3", {textContent: cat}), ...list.map((c) => el("div", {className: "card"}, [
        el("div", {className: "row"}, [el("code", {textContent: "/" + c.name}), c.loaded === false ? tag("non chargée", "ko") : c.loaded ? tag("active", "ok") : ""]),
        el("p", {textContent: c.description}),
        el("p", {className: "help", innerHTML: ""}, [el("b", {textContent: "Qui peut l'utiliser : "}), c.permission || "—"]),
        el("p", {className: "help"}, [el("b", {textContent: "Utilisation : "}), el("code", {textContent: c.usage})]),
        c.example ? el("p", {className: "help"}, [el("b", {textContent: "Exemple : "}), el("code", {textContent: c.example})]) : ""])));
    }
    if (!box.children.length) box.append(el("p", {className: "help", textContent: "Aucune commande ne correspond."}));
  };
  search.addEventListener("input", draw); draw();
  root.append(...head("Commandes du bot", "Tape « / » dans un salon Discord pour les voir. Si une commande n'apparaît pas, patiente quelques minutes après le démarrage du bot ou relance Discord. Chaque commande vérifie tes permissions réelles sur le serveur."), el("p", {}, search), box);
}

/* ---------- Pages avec tableau paginé ---------- */
async function pagedPage(root, title, intro, filters, endpoint, cols, state) {
  const out = el("div", {className: "card"});
  const bar = el("div", {className: "row f1", style: "margin-bottom:14px"}, filters.map((f) => f.node));
  const load = async () => {
    const params = new URLSearchParams({limit: state.limit, offset: state.offset});
    filters.forEach((f) => params.set(f.name, f.node.value));
    try {
      const d = await api(endpoint + "?" + params);
      if (state.onData) state.onData(d);
      out.replaceChildren(table(cols, d.items), pager(state, d.total, load));
    } catch (e) { toast(e.message, false); }
  };
  filters.forEach((f) => f.node.addEventListener(f.node.tagName === "SELECT" ? "change" : "input", () => { state.offset = 0; clearTimeout(load.h); load.h = setTimeout(load, 250); }));
  root.append(...head(title, intro), bar, out); await load();
}
const sel = (opts) => el("select", {}, opts.map(([v, l]) => option(v, l, false)));
const txt = (ph) => el("input", {type: "text", placeholder: ph});

async function pageModeration(root) {
  await pagedPage(root, "Historique de modération", "Toutes les sanctions données avec les commandes du bot (/warn, /timeout, /kick, /ban…). Pour sanctionner, utilise les commandes dans Discord : les actions depuis le panel arriveront plus tard.",
    [{name: "kind", node: sel([["", "Tous les types"], ...Object.entries(KIND_FR)])}, {name: "target", node: txt("Identifiant Discord du membre")}],
    "/api/sanctions", [{label: "#", key: "id"}, {label: "Date", render: (r) => fmtDate(r.created_at)}, {label: "Type", render: (r) => tag(KIND_FR[r.kind] || r.kind, r.kind === "warn" ? "wa" : "ko")},
      {label: "Membre", key: "target_id"}, {label: "Par", key: "actor_id"}, {label: "Durée", render: (r) => fmtDur(r.duration_s)}, {label: "Motif", key: "reason"}], {limit: 15, offset: 0});
}
async function pageMembers(root) {
  await pagedPage(root, "Membres", "Les membres vus par le bot depuis son installation (arrivées enregistrées). Discord ne donne pas au bot l'historique des anciens membres.",
    [{name: "q", node: txt("Rechercher par pseudo ou identifiant")}], "/api/members",
    [{label: "Pseudo", key: "username"}, {label: "Identifiant", key: "id"}, {label: "Arrivée", render: (r) => fmtDate(r.first_join)},
      {label: "Statut", render: (r) => r.left_at ? tag("Parti", "ko") : r.verified ? tag("Vérifié", "ok") : tag("Non vérifié", "wa")}, {label: "Avert.", key: "warnings"}], {limit: 15, offset: 0});
}
async function pageIds(root) {
  root.append(...head("Identifiants Discord", "Tous les identifiants (ID) des membres vus par le bot. Quand un membre réussit la vérification, son ID est ajouté ici, publié dans le salon de logs et écrit dans un fichier texte (un ID par ligne, sans doublon). Clique sur un ID pour le copier."),
    el("div", {className: "card"}, [el("div", {className: "row"}, [
      el("a", {className: "btn", href: "/api/ids/export.txt?scope=verified", textContent: "⬇️ TXT des vérifiés"}),
      el("a", {className: "btn", href: "/api/ids/export.txt?scope=all", textContent: "⬇️ TXT de tous les membres"}),
      el("button", {className: "sec", textContent: "Écrire le fichier sur le disque", onclick: async () => {
        try { const r = await api("/api/ids/sync", {method: "POST"}); toast(r.count + " ID écrits dans " + r.path); } catch (e) { toast(e.message, false); }
      }})]),
      el("p", {className: "help", textContent: "Le fichier du disque (dossier exports, ids_verifies.txt) se met à jour tout seul à chaque vérification. Le bouton sert à le régénérer à la main."})]));
  await pagedPage(root, "Liste des ID", "Recherche par pseudo ou par identifiant.",
    [{name: "q", node: txt("Rechercher par pseudo ou identifiant")}, {name: "verified", node: sel([["", "Tous les membres"], ["1", "Vérifiés uniquement"]])}],
    "/api/members", [{label: "Identifiant", render: (r) => el("code", {textContent: r.id, title: "Cliquer pour copier", style: "cursor:pointer",
        onclick: () => navigator.clipboard.writeText(r.id).then(() => toast("ID copié"), () => toast("Copie impossible", false))})},
      {label: "Pseudo", key: "username"}, {label: "Arrivée", render: (r) => fmtDate(r.first_join)},
      {label: "Statut", render: (r) => r.left_at ? tag("Parti", "ko") : r.verified ? tag("Vérifié", "ok") : tag("Non vérifié", "wa")}], {limit: 20, offset: 0});
}
async function pageLogs(root) {
  const kind = sel([["", "Tous les types"]]);
  const state = {limit: 20, offset: 0, onData: (d) => { if (kind.options.length === 1) d.kinds.forEach((k) => kind.append(option(k, k, false))); }};
  await pagedPage(root, "Journal des événements", "Tout ce que fait le bot : arrivées, départs, vérifications, modération, erreurs. Filtre sur « Erreur » pour voir ce qui n'a pas fonctionné et pourquoi.",
    [{name: "kind", node: kind}, {name: "result", node: sel([["", "Tous les résultats"], ["ok", "Réussis"], ["error", "Erreurs"]])}],
    "/api/logs", [{label: "Date", render: (r) => fmtDate(r.created_at)}, {label: "Type", render: (r) => el("code", {textContent: r.kind})}, {label: "Auteur", key: "actor_id"},
      {label: "Cible", key: "target_id"}, {label: "Résultat", render: (r) => tag(r.result === "ok" ? "OK" : "Erreur", r.result === "ok" ? "ok" : "ko")}, {label: "Détails", key: "details"}], state);
}

/* ---------- Routeur ---------- */
const PAGES = {guide: pageGuide, dashboard: pageDashboard, config: pageConfig, commands: pageCommands, moderation: pageModeration, members: pageMembers, ids: pageIds, logs: pageLogs};
async function route() {
  const key = PAGES[location.hash.slice(1)] ? location.hash.slice(1) : "guide";
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("active", a.dataset.k === key));
  const main = $("#main"); main.replaceChildren(el("p", {className: "help", textContent: "Chargement…"}));
  const fresh = el("div");
  try { await PAGES[key](fresh); main.replaceChildren(fresh); }
  catch (e) { if (e.status === 401) return showLogin(); main.replaceChildren(el("div", {className: "card", textContent: "Erreur : " + e.message})); }
}
function showLogin() { $("#layout").hidden = true; $("#loginBox").hidden = false; }
async function start() {
  try { HELP = await api("/api/help"); CONFIG = await api("/api/config"); } catch (e) { if (e.status === 401) return showLogin(); toast(e.message, false); return; }
  $("#loginBox").hidden = true; $("#layout").hidden = false;
  if (!$("#nav a")) NAV.forEach(([k, label]) => { const a = el("a", {href: "#" + k, textContent: label}); a.dataset.k = k; $("#nav").append(a); });
  await route();
}
window.addEventListener("hashchange", route);
$("#loginBtn").addEventListener("click", async () => {
  try { await api("/api/login", {method: "POST", body: JSON.stringify({password: $("#pwInput").value})}); $("#pwInput").value = ""; start(); }
  catch (e) { toast(e.message, false); }
});
$("#pwInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#loginBtn").click(); });
start();
</script></body></html>
